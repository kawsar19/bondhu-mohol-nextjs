<head>

<title>No connection</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f8f6; color: #202521; font-family: system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .icon { width: 64px; height: 64px; border-radius: 16px; background: #174d3c; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #68756b; font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  button { height: 44px; padding: 0 24px; border: 0; border-radius: 12px; background: #174d3c; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }

<body>
  <main>
    <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>No internet connection. Orders can't load until the device is back online.<br>Wi-Fi বা মোবাইল ডেটা চালু আছে কি না দেখুন।</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
